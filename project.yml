name: BENDREffects
options:
  bundleIdPrefix: com.bendr.fxplug
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    # FxPlug framework lives inside FCP.app
    FRAMEWORK_SEARCH_PATHS:
      - "/Applications/Final Cut Pro.app/Contents/Frameworks"
      - "$(inherited)"
    # Link against FxPlug
    OTHER_LDFLAGS:
      - "-framework"
      - "FxPlug"
      - "$(inherited)"
    # Rpath so the XPC service can find FxPlug at runtime
    LD_RUNPATH_SEARCH_PATHS:
      - "/Applications/Final Cut Pro.app/Contents/Frameworks"
      - "$(inherited)"

# --- File groups ---
fileGroups:
  - Shared

# --- Targets ---
targets:

  # ============================================================
  # PHASE 1: BENDR VHS
  # ============================================================

  BENDRVHSApp:
    type: application
    platform: macOS
    sources:
      - path: BENDRVHSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendr.fxplug.vhs
        INFOPLIST_FILE: BENDRVHSApp/Info.plist
    dependencies:
      - target: BENDRVHSService
        embed: true
        codeSign: true
        copy:
          destination: plugins

  BENDRVHSService:
    type: xpc-service
    platform: macOS
    sources:
      - path: BENDRVHSService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendr.fxplug.vhs.service
        INFOPLIST_FILE: BENDRVHSService/Info.plist
        CODE_SIGN_ENTITLEMENTS: BENDRVHSService/BENDRVHSService.entitlements
        MTL_HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shared/Metal"
          - "$(inherited)"

  # ============================================================
  # PHASE 1: BENDR CRT
  # ============================================================

  BENDRCRTApp:
    type: application
    platform: macOS
    sources:
      - path: BENDRCRTApp
    settings:
