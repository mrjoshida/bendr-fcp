schemes:
  BENDRVHSApp:
    build:
      targets:
        BENDRVHSApp: all
    run:
      config: Debug

  BENDRCRTApp:
    build:
      targets:
        BENDRCRTApp: all
    run:
      config: Debug

  BENDRFeedbackApp:
    build:
      targets:
        BENDRFeedbackApp: all
    run:
      config: Debug

  BENDRColourApp:
    build:
      targets:
        BENDRColourApp: all
    run:
