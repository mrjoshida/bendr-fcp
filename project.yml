        PRODUCT_BUNDLE_IDENTIFIER: com.bendr.fxplug.crt.service
        INFOPLIST_FILE: BENDRCRTService/Info.plist
        CODE_SIGN_ENTITLEMENTS: BENDRCRTService/BENDRCRTService.entitlements
        MTL_HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Shared/Metal"
          - "$(inherited)"

  # ============================================================
  # PHASE 1: BENDR Feedback
