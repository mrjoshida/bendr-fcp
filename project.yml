        PRODUCT_BUNDLE_IDENTIFIER: com.bendr.fxplug.crt
        INFOPLIST_FILE: BENDRCRTApp/Info.plist
    dependencies:
      - target: BENDRCRTService
        embed: true
        codeSign: true
        copy:
          destination: plugins

  BENDRCRTService:
    type: xpc-service
    platform: macOS
