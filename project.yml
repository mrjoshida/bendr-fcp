        BENDRScanApp: all
    run:
      config: Debug

  BENDRCorruptApp:
    build:
      targets:
        BENDRCorruptApp: all
    run:
      config: Debug

  AllPlugins:
    build:
      targets:
        BENDRVHSApp: all
        BENDRCRTApp: all
        BENDRFeedbackApp: all
        BENDRColourApp: all
        BENDRScanApp: all
        BENDRCorruptApp: all
    run:
      config: Debug
